<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080b10"><title>Gulf Ping Monitor v16.1</title>
<style>
:root{color-scheme:dark;--bg:#080b10;--card:#111923;--line:#273444;--muted:#9aa9ba;--cyan:#42c6d8}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -30%,#153043 0,transparent 55%),var(--bg);color:#f3f7fb;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}header{padding:18px 16px;text-align:center;border-bottom:1px solid var(--line);font-weight:750;font-size:18px}main{max-width:680px;margin:36px auto;padding:0 14px}.actions{display:flex;justify-content:center;gap:9px;margin-bottom:18px}button{background:#183344;border:1px solid #346075;color:#fff;border-radius:9px;padding:10px 18px;font:inherit;font-size:13px;cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}.servers{display:grid;grid-template-columns:minmax(0,420px);justify-content:center;gap:13px}.server{border:1px solid #273d50;background:linear-gradient(145deg,#111d29,#0b121a);border-radius:16px;padding:22px 12px;text-align:center}.name{font-size:17px;font-weight:700;margin-bottom:22px}.metric-label{font-size:12px;color:var(--muted);margin-bottom:7px}.ping{font-size:clamp(30px,8vw,44px);font-weight:800;color:var(--cyan);font-variant-numeric:tabular-nums;direction:ltr}.avg{font-size:clamp(22px,6vw,30px);font-weight:700;color:#f3f7fb;font-variant-numeric:tabular-nums;direction:ltr;margin-bottom:19px}.unit{font-size:12px;color:var(--muted);font-weight:500}.divider{height:1px;background:var(--line);margin:18px 0}@media(max-width:420px){main{margin:24px auto}.server{padding:18px 8px}.name{font-size:15px}}
</style></head><body>
<header>قياس بنق سيرفرات الخليج</header>
<main><div class="actions"><button id="start">بدء القياس المباشر</button><button id="stop" disabled>إيقاف</button></div>
<section class="servers" aria-label="Gulf servers">
 <article class="server"><div class="name">🇦🇪 الإمارات</div><div class="metric-label">البنق الحالي</div><div class="ping" id="ping-ae">— <span class="unit">ms</span></div><div class="divider"></div><div class="metric-label">متوسط البنق</div><div class="avg" id="avg-ae">— <span class="unit">ms</span></div></article>
</section></main>
<script>
const REGIONS=[{id:'me-central-1',key:'ae'}];
const TIMEOUT=2500,HISTORY=60;let running=false,busy=false,timer=null,controller=null;
const data=new Map(REGIONS.map(r=>[r.key,{current:null,samples:[]} ]));
const el=id=>document.getElementById(id);
function paint(){for(const r of REGIONS){const d=data.get(r.key),avg=d.samples.length?d.samples.reduce((a,b)=>a+b,0)/d.samples.length:null;el('ping-'+r.key).innerHTML=(d.current===null?'—':Math.round(d.current))+' <span class="unit">ms</span>';el('avg-'+r.key).innerHTML=(avg===null?'—':Math.round(avg))+' <span class="unit">ms</span>';}}
async function measure(region,signal){const url=`https://dynamodb.${region.id}.amazonaws.com/?ping=${Date.now()}-${Math.random().toString(36).slice(2)}`;const c=new AbortController(),t=setTimeout(()=>c.abort(),TIMEOUT);const abort=()=>c.abort();signal.addEventListener('abort',abort,{once:true});const start=performance.now();try{await fetch(url,{method:'GET',mode:'no-cors',cache:'no-store',credentials:'omit',redirect:'follow',signal:c.signal});return performance.now()-start;}finally{clearTimeout(t);signal.removeEventListener('abort',abort);}}
async function tick(){if(!running||busy)return;busy=true;controller=new AbortController();await Promise.all(REGIONS.map(async r=>{const d=data.get(r.key);try{const ms=await measure(r,controller.signal);if(running){d.current=ms;d.samples.push(ms);if(d.samples.length>HISTORY)d.samples.shift();}}catch{if(running)d.current=null;}}));paint();busy=false;controller=null;if(running)timer=setTimeout(tick,1000);}
function start(){if(running)return;running=true;for(const d of data.values()){d.current=null;d.samples=[];}paint();el('start').disabled=true;el('stop').disabled=false;tick();}
function stop(){running=false;if(timer)clearTimeout(timer);timer=null;if(controller)controller.abort();el('start').disabled=false;el('stop').disabled=true;}
el('start').addEventListener('click',start);el('stop').addEventListener('click',stop);document.addEventListener('visibilitychange',()=>{if(document.hidden&&running)stop();});paint();
</script></body></html>
